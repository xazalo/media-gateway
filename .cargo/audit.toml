[advisories]
ignore = [
    # rsa viene de sqlx-mysql, que no usamos (default-features = false, solo postgres)
    "RUSTSEC-2023-0071",
    # libsqlite3-sys viene de sqlx-sqlite, que no usamos (default-features = false, solo postgres)
    "RUSTSEC-2026-0459",
    #
    # NOTA: Las siguientes vulnerabilidades son REALES y activas, pero dependen del AWS SDK
