    # actualice aws-smithy-http-client. Las dejamos reportadas para visibilidad:
    #   RUSTSEC-2026-0258 (h2), RUSTSEC-2026-0346, RUSTSEC-2026-0349 (rustls),
    #   RUSTSEC-2026-0098, 0099, 0382, 0104 (rustls-webpki)
]
