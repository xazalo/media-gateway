services:
  media-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 3004, no 3003: el 3003 ya lo usa la API (backend/Dockerfile). En el
      # deploy separado ver ../microservices/media/docker-compose.yml.
      - "3004:3004"
    environment:
      - HOST=0.0.0.0
      - PORT=3004
      - RUST_LOG=info
      - DATABASE_URL=postgres://clubify:password@host.docker.internal:5432/media_gateway
      - REDIS_URL=redis://host.docker.internal:6379
      - JWT_SECRET=***
      - S3_ENDPOINT=***
      - S3_BUCKET=***
      - S3_REGION=***
      - S3_ACCESS_KEY=***
      - S3_SECRET_KEY=***
      - BUNNY_CDN_URL=***
      - TRAFFIC_MAX_DAILY_BYTES=107374182400
      - TRAFFIC_MAX_MONTHLY_BYTES=2199023255552
      - TRAFFIC_MAX_DAILY_DOWNLOADS=50000
      - TRAFFIC_MAX_USER_DAILY_BYTES=10737418240
      - TRAFFIC_MAX_USER_DAILY_DOWNLOADS=500
      - TRAFFIC_MAX_REQUESTS_PER_HOUR=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3004'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
